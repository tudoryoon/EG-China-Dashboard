name: Deploy Regional Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Read main after the Pages lock, not a possibly older dispatch/push SHA.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migration and data
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_migration.py
          python scripts/validate_asia_screening.py
          node --check dashboard.js
          node --check data/dashboard-data.js
      - uses: actions/configure-pages@v5
      - name: Package static site
        run: |
          mkdir -p _site/data
          cp index.html dashboard.js styles.css header-refresh.css .nojekyll _site/
          cp data/dashboard-data.js data/asia-*-screening.json _site/data/
          if [ -f data/taiwan-collection-status.json ]; then cp data/taiwan-collection-status.json _site/data/; fi
      - uses: actions/upload-pages-artifact@v3
        id: pages-artifact
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        shell: bash
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return an artifact ID."
            exit 1
          fi
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME"
          filter='.artifacts[] | select(.expired == false) | .id'
          for attempt in {1..12}; do
            if visible_id="$(gh api "$endpoint" --jq "$filter")" &&
              [[ "$visible_id" == "$PAGES_ARTIFACT_ID" ]]; then
              # Deploy Pages reads artifact metadata through a separate service.
              sleep 10
              exit 0
            fi
            echo "Waiting for Pages artifact $PAGES_ARTIFACT_ID ($attempt/12)."
            if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
          done
          echo "::error::The uploaded Pages artifact is not visible for this run."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
