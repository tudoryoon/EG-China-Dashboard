name: Recover Failed Pages Deployment

on:
  workflow_run:
    workflows: [Deploy Regional Dashboard]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-pages-delivery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Use only trusted default-branch code; never execute a failed run's artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Retry missing Pages deployment without collecting or pushing data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ensure_pages_deployment.py --recover
