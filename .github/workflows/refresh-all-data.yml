name: Shared All Data Refresh

on:
  workflow_call:
    inputs:
      check_only:
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: refresh-all-regional-data
      cancel-in-progress: false
      queue: max
    steps:
      # Read main AFTER acquiring the lock, including a predecessor's checkpoint.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retry and skip behavior
        run: python -m unittest discover -s tests -v
      - name: Check today's complete refresh
        id: freshness
        run: python scripts/refresh_all_data.py check
      - name: Explain skipped update
        if: steps.freshness.outputs.skip == 'true' || inputs.check_only
        run: echo 'No data update, commit, push, or deployment is needed for this run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        with:
          path: .asia-screening-cache
          key: asia-screening-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: asia-screening-
      - name: Install data dependencies
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        run: python -m pip install -r requirements.txt
      - name: Validate regional quote and scoring integration
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        run: python -m unittest discover -s tests -p test_regional_supplements.py -v
      - name: Refresh and validate every data source
        id: refresh
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        env:
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -o pipefail
          python scripts/refresh_all_data.py refresh 2>&1 | tee "$RUNNER_TEMP/refresh-data.log"
      - name: Report refresh failure
        if: failure() && steps.refresh.outcome == 'failure'
        shell: bash
        run: |
          echo '### Data refresh failed; no data was published. Later attempts will retry.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 45 "$RUNNER_TEMP/refresh-data.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish completed data together
        id: publish
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        shell: bash
        run: |
          git add data/asia-*.json data/dashboard-data.js .github/data-refresh-status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update all China, Hong Kong and Taiwan data'
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then
              echo 'pushed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Deploy only newly published data
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
