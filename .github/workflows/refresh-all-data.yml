name: Shared All Data Refresh

on:
  workflow_call:
    inputs:
      check_only:
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    # One full regional collection can take about 40 minutes. Keep enough room
    # for repeated provider recovery attempts without ever publishing a partial run.
    timeout-minutes: 330
    concurrency:
      group: refresh-all-regional-data
      cancel-in-progress: false
      queue: max
    steps:
      # Read main AFTER acquiring the lock, including a predecessor's checkpoint.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retry and skip behavior
        run: python -m unittest discover -s tests -v
      - name: Check today's complete refresh
        id: freshness
        run: python scripts/refresh_all_data.py check
      - name: Explain skipped update
        if: steps.freshness.outputs.skip == 'true' || inputs.check_only
        run: echo 'No data update, commit, push, or deployment is needed for this run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        with:
          path: .asia-screening-cache
          key: asia-screening-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: asia-screening-
      - name: Install data dependencies
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        run: python -m pip install -r requirements.txt
      - name: Validate regional quote and scoring integration
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        run: python -m unittest discover -s tests -p test_regional_supplements.py -v
      - name: Refresh and validate every data source
        id: refresh
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        env:
          PYTHONUNBUFFERED: '1'
          MAX_REFRESH_ATTEMPTS: '6'
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/refresh-data.log"
          : > "$log"
          for attempt in $(seq 1 "$MAX_REFRESH_ATTEMPTS"); do
            echo "Refresh attempt $attempt/$MAX_REFRESH_ATTEMPTS" | tee -a "$log"
            set +e
            python scripts/refresh_all_data.py refresh 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_REFRESH_ATTEMPTS" ]; then
              echo "All $MAX_REFRESH_ATTEMPTS refresh attempts failed." | tee -a "$log"
              exit "$status"
            fi
            delay=$((attempt * 60))
            echo "Attempt $attempt failed; retrying the complete atomic refresh in ${delay}s." | tee -a "$log"
            sleep "$delay"
          done
      - name: Audit every regional security date before publication
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        run: python scripts/validate_asia_screening.py
      - name: Report refresh failure
        if: failure() && steps.refresh.outcome == 'failure'
        shell: bash
        run: |
          echo '### All in-run refresh attempts failed; no data was published. A queued backup will retry.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 "$RUNNER_TEMP/refresh-data.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish completed data together
        id: publish
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        shell: bash
        run: |
          git add data/asia-*.json data/dashboard-data.js .github/data-refresh-status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update all China, Hong Kong and Taiwan data'
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then
              echo 'pushed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Deploy only newly published data
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Queue another recovery run after failure
        if: failure() && !inputs.check_only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run update-all-data-backup-2.yml --ref main
          echo 'Another guarded recovery run was queued. Retries continue until a validated refresh succeeds.' >> "$GITHUB_STEP_SUMMARY"
