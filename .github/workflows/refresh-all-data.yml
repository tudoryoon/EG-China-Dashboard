name: Shared All Data Refresh

on:
  workflow_call:
    inputs:
      check_only:
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Six 45-minute collection attempts + 15 minutes of backoff leave 45 minutes
    # for setup, publication and shutdown. Recovery runs in a separate job below.
    timeout-minutes: 330
    concurrency:
      group: refresh-all-regional-data
      cancel-in-progress: false
      queue: max
    steps:
      # Read main AFTER acquiring the lock, including a predecessor's checkpoint.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retry and skip behavior
        run: python -m unittest discover -s tests -v
      - name: Check today's complete refresh
        id: freshness
        run: python scripts/refresh_all_data.py check
      - name: Explain skipped update
        if: steps.freshness.outputs.skip == 'true' || inputs.check_only
        run: echo 'Data collection, commit and push are skipped. Publication runs still check whether committed main needs Pages delivery.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        with:
          path: .asia-screening-cache
          key: asia-screening-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: asia-screening-
      - name: Install data dependencies
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        run: python -m pip install -r requirements.txt
      - name: Validate quote, scoring and Taiwan integration
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        run: python -m unittest discover -s tests -v
      - name: Refresh and validate every data source
        id: refresh
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        env:
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/refresh-data.log"
          python scripts/retry_data_refresh.py 2>&1 | tee "$log"
      - name: Audit every regional security date before publication
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        run: python scripts/validate_asia_screening.py
      - name: Report refresh failure
        if: failure() && steps.refresh.outcome == 'failure'
        shell: bash
        run: |
          echo '### All in-run refresh attempts failed; no data was published. A queued backup will retry.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 "$RUNNER_TEMP/refresh-data.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish completed data together
        id: publish
        if: steps.freshness.outputs.skip != 'true' && !inputs.check_only
        shell: bash
        run: |
          git add data/asia-*.json data/dashboard-data.js data/taiwan-collection-status.json .github/data-refresh-status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update all China, Hong Kong and Taiwan data'
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            # Never push old calculations over a pipeline changed during collection.
            python scripts/refresh_all_data.py verify-publication || exit 1
            if git push origin HEAD:main; then
              echo 'pushed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Ensure committed main is deployed, including delivery recovery
        if: success() && !inputs.check_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ensure_pages_deployment.py
  recovery:
    # The Python attempt deadline exits as failure, so this job queues recovery.
    # GitHub's whole-job timeout is cancelled and handled by the completion watcher.
    needs: update
    if: always() && needs.update.result == 'failure' && !inputs.check_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Queue another recovery run after failure or attempt timeout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Avoid a tight dispatch loop if setup or another deterministic check fails.
          sleep 300
          for attempt in 1 2 3; do
            if gh workflow run update-all-data-backup-2.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo 'Another guarded recovery run was queued after failure or timeout. Retries continue until a validated refresh succeeds.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 30))
          done
          echo 'Recovery dispatch failed after three attempts; a later scheduled run can retry.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
