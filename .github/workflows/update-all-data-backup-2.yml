name: Update All Data - KST 21:17

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Validate automation without downloading or publishing data
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-all-data.yml
    with:
      check_only: ${{ inputs.check_only || false }}
