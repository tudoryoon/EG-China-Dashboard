name: Update All Data - KST 21:03
run-name: Update All Data - KST 21:03${{ inputs.check_only && ' [check-only]' || '' }}

on:
  schedule:
    - cron: '3 12 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Validate automation without downloading or publishing data
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-all-data.yml
    with:
      check_only: ${{ inputs.check_only || false }}
