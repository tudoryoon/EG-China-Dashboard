name: Verify Full Data Refresh

on:
  workflow_dispatch:
    inputs:
      benchmark_only:
        description: Verify official HSI, CSI800 and STAR50 collection without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.benchmark_only }}
        with:
          path: .asia-screening-cache
          key: asia-screening-verification-${{ github.run_id }}
          restore-keys: asia-screening-
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect and validate all sources without publishing
        if: ${{ !inputs.benchmark_only }}
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/refresh_all_data.py refresh --force
      - name: Verify official benchmark collection on the Actions runner
        if: inputs.benchmark_only
        run: |
          python - <<'PY'
          from datetime import datetime
          import json
          import sys
          sys.path.insert(0, 'scripts')
          import update_asia_screening as collector
          from refresh_all_data import KST, expected_session
          now = datetime.now(KST)
          hk = expected_session('XHKG', now)
          cn = expected_session('XSHG', now)
          for name, expected, fetch in [
              ('HSI', hk, lambda: collector.official_hsi_history(hk)),
              ('CSI800', cn, lambda: collector.official_csi800_history(cn)),
              ('STAR50', cn, lambda: collector.sse_star50_history(cn, collector.get)),
          ]:
              payload = fetch()
              assert len(payload['records']) >= 400
              assert payload['records'][-1]['date'] == expected
              print(json.dumps({'index': name, 'session': expected,
                                'close': payload['records'][-1]['close'],
                                'source': payload['priceSource']}), flush=True)
          PY
